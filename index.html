<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Pemilihan Formatur IMM JPMIPA 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, sans-serif;
        }

        :root {
            --maroon: #800000;
            --light-maroon: #a52a2a;
            --dark-maroon: #5a0000;
            --cream: #faf7f2;
            --cream-dark: #f2ede4;
            --gold: #d4a017;
            --gold-light: #f0d483;
            --gold-pale: #fbf6e9;
            --text-dark: #1f1a17;
            --text-mid: #57504a;
            --text-light: #8a8178;
            --border: #ece6da;
        }

        body {
            background:
                radial-gradient(1200px 600px at 100% -10%, rgba(212, 160, 23, 0.08), transparent 60%),
                radial-gradient(900px 500px at 0% 0%, rgba(128, 0, 0, 0.06), transparent 55%),
                var(--cream);
            color: var(--text-dark);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== FLOATING HEADER ===== */
        header {
            background: linear-gradient(135deg, rgba(90, 0, 0, 0.96), rgba(128, 0, 0, 0.96) 55%, rgba(150, 24, 24, 0.96));
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            color: white;
            padding: 0.7rem 1.4rem;
            box-shadow:
                0 14px 44px -14px rgba(90, 0, 0, 0.55),
                0 4px 14px rgba(0, 0, 0, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
            position: sticky;
            top: 14px;
            z-index: 1000;
            border-radius: 24px;
            margin: 14px 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: white;
            box-shadow:
                0 0 0 2px rgba(212, 160, 23, 0.6),
                0 6px 18px rgba(0, 0, 0, 0.28);
            flex-shrink: 0;
        }

        .logo-icon img {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
        }

        .logo-text h1 {
            font-size: 1.35rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.02em;
        }

        .logo-text span {
            font-size: 0.78rem;
            display: block;
            font-weight: 500;
            opacity: 0.85;
        }

        /* ===== REGISTER SECTION ===== */
        .register-section {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 2.5rem 0;
        }

        .register-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(90, 0, 0, 0.12);
            width: 100%;
            max-width: 520px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .register-header {
            background: linear-gradient(135deg, var(--dark-maroon), var(--maroon));
            color: white;
            padding: 2.2rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .register-header::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(400px 200px at 20% 20%, rgba(240, 212, 131, 0.14), transparent 60%),
                radial-gradient(300px 150px at 80% 80%, rgba(255, 255, 255, 0.08), transparent 60%);
            pointer-events: none;
        }

        .register-header h2,
        .register-header p {
            position: relative;
            z-index: 1;
        }

        .register-header h2 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.4rem;
            letter-spacing: -0.02em;
        }

        .register-header p {
            opacity: 0.9;
            font-size: 0.92rem;
        }

        .register-body {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: var(--text-dark);
            font-size: 0.86rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.92rem;
            font-family: inherit;
            transition: all 0.25s ease;
            background: var(--cream);
            color: var(--text-dark);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--maroon);
            background: white;
            box-shadow: 0 0 0 4px rgba(128, 0, 0, 0.08);
        }

        .form-group input::placeholder {
            color: #b3a99c;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            background: linear-gradient(135deg, var(--gold) 0%, #b8860b 100%);
            color: white;
            padding: 14px 30px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 18px rgba(212, 160, 23, 0.35);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(212, 160, 23, 0.45);
        }

        .btn:active { transform: translateY(0); }

        .btn:disabled {
            background: #e5e0d8 !important;
            color: #a8a093 !important;
            cursor: not-allowed !important;
            transform: none !important;
            box-shadow: none !important;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 1.25rem;
            display: none;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #dcfce7;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .success-actions {
            margin-top: 1rem;
            display: flex;
        }

        .success-actions .btn {
            flex: 1;
            padding: 11px 18px;
            font-size: 0.86rem;
        }

        /* ===== FOOTER ===== */
        footer {
            background: linear-gradient(135deg, var(--dark-maroon), #3a0000);
            color: white;
            padding: 2.5rem 0 1.5rem;
            text-align: center;
            border-radius: 28px 28px 0 0;
            margin: 3rem 20px 0;
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
        }

        .footer-logo {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            margin-bottom: 0.6rem;
            border: 1px solid rgba(240, 212, 131, 0.35);
        }

        .footer-logo img {
            width: 46px;
            height: 46px;
            border-radius: 50%;
        }

        .footer-links {
            display: flex;
            gap: 2rem;
            margin: 1rem 0;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--gold-light);
        }

        footer p {
            opacity: 0.7;
            font-size: 0.85rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            header {
                top: 10px;
                margin: 10px 12px 0;
                padding: 0.65rem 1rem;
                border-radius: 18px;
            }

            .logo-text h1 { font-size: 1.15rem; }
            .logo-text span { font-size: 0.72rem; }
            .logo-icon { width: 44px; height: 44px; }
            .logo-icon img { width: 40px; height: 40px; }

            .register-container {
                margin: 0 12px;
                border-radius: 20px;
            }

            .register-header { padding: 1.8rem 1.5rem; }
            .register-header h2 { font-size: 1.5rem; }

            .register-body { padding: 1.5rem; }

            footer {
                margin: 2.5rem 12px 0;
                border-radius: 22px 22px 0 0;
            }
        }

        @media (max-width: 480px) {
            .container { padding: 0 14px; }
            .register-header h2 { font-size: 1.35rem; }
            .register-header p { font-size: 0.85rem; }
            .register-body { padding: 1.25rem; }
            .footer-links { gap: 1.2rem; }
            .footer-links a { font-size: 0.82rem; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container header-content">
            <div class="logo">
                <div class="logo-icon">
                    <img src="picture/imm.png" alt="Logo IMM">
                </div>
                <div class="logo-text">
                    <h1>IMM JPMIPA</h1>
                    <span>Ikatan Mahasiswa Muhammadiyah</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Register Section -->
    <section class="register-section">
        <div class="register-container">
            <div class="register-header">
                <h2>Daftar Akun Baru</h2>
                <p>Buat akun untuk mengakses sistem pemilihan Formatur IMM 2026</p>
            </div>
            <div class="register-body">
                <div class="alert alert-error" id="errorAlert"></div>
                <div class="alert alert-success" id="successAlert"></div>

                <form id="registerForm">
                    <div class="form-group">
                        <label for="fullName">Nama Lengkap</label>
                        <input type="text" id="fullName" placeholder="Masukkan nama lengkap Anda" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Masukkan email UAD Anda" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Masukkan password (min. 6 karakter)" minlength="6" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Konfirmasi Password</label>
                        <input type="password" id="confirmPassword" placeholder="Masukkan ulang password" minlength="6" required>
                    </div>

                    <div class="form-group">
                        <label for="nim">NIM</label>
                        <input type="text" id="nim" placeholder="Masukkan NIM Anda" required>
                    </div>

                    <div class="form-group">
                        <label for="studyProgram">Program Studi</label>
                        <input type="text" id="studyProgram" placeholder="Masukkan program studi Anda" required>
                    </div>

                    <div class="form-group">
                        <label for="semester">Semester</label>
                        <select id="semester" required>
                            <option value="">Pilih Semester</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>

                    <button type="submit" class="btn" id="registerBtn">
                        <i class="fas fa-user-plus"></i> Daftar
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <div class="footer-logo">
                <img src="picture/imm.png" alt="Logo IMM">
            </div>
            <p>Pemilihan Formatur IMM JPMIPA 2026</p>
            <div class="footer-links">
                <a href="#">Tentang</a>
                <a href="#">Kebijakan Privasi</a>
                <a href="#">Kontak</a>
            </div>
            <p>&copy; 2026 IMM JPMIPA. Semua hak dilindungi.</p>
        </div>
    </footer>

<script type="module">
    // ==================== IMPORTS MODULAR SDK v13.3.0 ====================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-analytics.js";
    import {
        getAuth,
        createUserWithEmailAndPassword,
        signOut,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
    import {
        getFirestore,
        doc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

    // ==================== FIREBASE INIT ====================
    const firebaseConfig = {
        apiKey: "AIzaSyClyCZ2khr-7axTAscc68LeOpRs3_1UZaQ",
        authDomain: "immjp-d7897.firebaseapp.com",
        projectId: "immjp-d7897",
        storageBucket: "immjp-d7897.firebasestorage.app",
        messagingSenderId: "123997569817",
        appId: "1:123997569817:web:95d13b4a334fa393d53b88",
        measurementId: "G-KCQ1K21745"
    };

    const app = initializeApp(firebaseConfig);
    try { getAnalytics(app); } catch (e) { console.warn('Analytics tidak tersedia:', e); }

    const auth = getAuth(app);
    const db = getFirestore(app);

    // ==================== DOM ELEMENTS ====================
    const registerForm = document.getElementById('registerForm');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');
    const registerBtn = document.getElementById('registerBtn');

    // ==================== HELPERS ====================
    function showAlert(alertElement, message) {
        alertElement.textContent = message;
        alertElement.style.display = 'block';
        setTimeout(() => {
            alertElement.style.display = 'none';
        }, 5000);
    }

    function clearForm() {
        document.getElementById('fullName').value = '';
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
        document.getElementById('confirmPassword').value = '';
        document.getElementById('nim').value = '';
        document.getElementById('studyProgram').value = '';
        document.getElementById('semester').value = '';
    }

    function showSuccessMessage() {
        successAlert.innerHTML = `
            <i class="fas fa-check-circle"></i> Pendaftaran berhasil!
            <div class="success-actions">
                <button class="btn" onclick="clearFormAndContinue()" type="button">
                    <i class="fas fa-user-plus"></i> Daftar Akun Baru
                </button>
            </div>
        `;
        successAlert.style.display = 'block';
        registerForm.style.display = 'none';
    }

    // expose to global so inline onclick can call it
    window.clearFormAndContinue = function() {
        clearForm();
        successAlert.style.display = 'none';
        registerForm.style.display = 'block';
        document.getElementById('fullName').focus();
    };

    // ==================== REGISTER SUBMIT ====================
    registerForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const nim = document.getElementById('nim').value.trim();
        const studyProgram = document.getElementById('studyProgram').value.trim();
        const semester = document.getElementById('semester').value;

        // Validate password confirmation
        if (password !== confirmPassword) {
            showAlert(errorAlert, 'Konfirmasi password tidak sesuai!');
            return;
        }

        // Disable button while processing
        registerBtn.disabled = true;
        registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';

        // Create user with Firebase Auth (modular)
        createUserWithEmailAndPassword(auth, email, password)
            .then((userCredential) => {
                const user = userCredential.user;

                // Prepare user data for Firestore
                const userData = {
                    name: fullName,
                    email: email,
                    isAdmin: false,
                    nim: nim,
                    studyProgram: studyProgram,
                    semester: semester,
                    createdAt: serverTimestamp()
                };

                // Save user data to Firestore (modular)
                return setDoc(doc(db, 'users', user.uid), userData);
            })
            .then(() => {
                showSuccessMessage();
                // Sign out to allow registering another account
                return signOut(auth);
            })
            .catch((error) => {
                console.error('Registration error:', error);
                let errorMessage = 'Terjadi kesalahan saat pendaftaran.';

                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = 'Email sudah digunakan. Silakan gunakan email lain.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Format email tidak valid.';
                        break;
                    case 'auth/weak-password':
                        errorMessage = 'Password terlalu lemah (minimal 6 karakter).';
                        break;
                    case 'auth/operation-not-allowed':
                        errorMessage = 'Metode pendaftaran Email/Password belum diaktifkan di Firebase.';
                        break;
                    case 'auth/network-request-failed':
                        errorMessage = 'Koneksi jaringan bermasalah. Silakan coba lagi.';
                        break;
                }

                showAlert(errorAlert, errorMessage);
            })
            .finally(() => {
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Daftar';
            });
    });

    // ==================== AUTH STATE LISTENER ====================
    onAuthStateChanged(auth, (user) => {
        if (user) {
            console.log('User sudah login:', user.email);
        }
    });
</script>
</body>
</html>
